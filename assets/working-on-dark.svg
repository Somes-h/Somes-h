<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="596" viewBox="0 0 1000 596" role="img" aria-label="Working on: referrals and growth, real-time and social, identity and sign-in, platform; previously payments">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#16233a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="596" rx="18" fill="#0b1220"/>
  <rect width="1000" height="596" rx="18" fill="url(#g)"/>
  <line x1="64" y1="54" x2="64" y2="360" stroke="#1e3a5f" stroke-width="2.5"/><line x1="64" y1="360" x2="64" y2="476" stroke="#1e3a5f" stroke-width="2.5" stroke-dasharray="4 6"/>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.00s" fill="freeze"/><circle cx="64" cy="54" r="9" fill="#38bdf8"/><circle cx="64" cy="54" r="4" fill="#0b1220"/><rect x="100" y="41" width="144.0" height="26" rx="6" fill="#0f1b2e" stroke="#38bdf8" stroke-width="1.2"/><text x="172.0" y="59" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#38bdf8">feat(referrals)</text><text x="258.0" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Referrals &amp; growth</text><rect x="453.8" y="43" width="74" height="22" rx="11" fill="#38bdf8"/><text x="490.8" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0b1220">HEAD</text><text x="100" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Built the referral tracker: a ledger of referrals and reward bonuses with expiry, filterable history,</text><text x="100" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">referee search and push nudges, rolled out behind feature flags.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.25s" fill="freeze"/><circle cx="64" cy="164" r="9" fill="#34d399"/><circle cx="64" cy="164" r="4" fill="#0b1220"/><rect x="100" y="151" width="118.8" height="26" rx="6" fill="#0f1b2e" stroke="#34d399" stroke-width="1.2"/><text x="159.4" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#34d399">feat(social)</text><text x="232.8" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Real-time &amp; social</text><text x="100" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Direct messages over WebSockets, push notifications, follower feeds and multi-language content.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.50s" fill="freeze"/><circle cx="64" cy="250" r="9" fill="#a78bfa"/><circle cx="64" cy="250" r="4" fill="#0b1220"/><rect x="100" y="237" width="135.6" height="26" rx="6" fill="#0f1b2e" stroke="#a78bfa" stroke-width="1.2"/><text x="167.8" y="255" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a78bfa">feat(identity)</text><text x="249.6" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Identity &amp; sign-in</text><text x="100" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">One-tap sign-up and login with Google, Facebook and Apple, with OAuth token verification and account</text><text x="100" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">linking.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.75s" fill="freeze"/><circle cx="64" cy="360" r="9" fill="#fbbf24"/><circle cx="64" cy="360" r="4" fill="#0b1220"/><rect x="100" y="347" width="135.6" height="26" rx="6" fill="#0f1b2e" stroke="#fbbf24" stroke-width="1.2"/><text x="167.8" y="365" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#fbbf24">feat(platform)</text><text x="249.6" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Platform</text><text x="100" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Serverless Python microservices on AWS: API Gateway and Lambda, Cognito for user auth, DynamoDB for</text><text x="100" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">storage and SQS for async work.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="0.55" dur="0.6s" begin="1.00s" fill="freeze"/><circle cx="64" cy="476" r="8" fill="#0b1220" stroke="#475569" stroke-width="2.5"/><rect x="100" y="463" width="135.6" height="26" rx="6" fill="#0f1b2e" stroke="#475569" stroke-width="1.2"/><text x="167.8" y="481" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#475569">prev(payments)</text><text x="249.6" y="483" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Payments</text><text x="100" y="516" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Card payments end to end, including 3DS challenges, tokenised card storage, payouts, chargebacks and</text><text x="100" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">provider webhooks.</text></g>
</svg>
